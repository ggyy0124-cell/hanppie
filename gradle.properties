org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.parallel=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Native release linking optimizes the shared UI, renderer and agent runtime together.
# The heap only applies out of process; the in-daemon compiler would share the 4 GB Gradle heap.
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx6g
