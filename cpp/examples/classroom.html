<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanppie 课堂演示</title>
<style>
  :root { color-scheme: light dark; --accent: #b91c1c; --line: #8884; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 12px 16px; min-height: 0; }
  section { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  label { font-weight: 600; font-size: 13px; }
  textarea, pre { font: 14px/1.45 ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 0; }
  textarea { resize: none; tab-size: 4; }
  #code { flex: 1; }
  #input { height: 5.5em; }
  #output { flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  #output .note { opacity: .65; }
  #output .error { color: var(--accent); }
  select { min-width: 0; max-width: 100%; }
  select, button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); }
  button { min-width: 72px; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  #run { background: var(--accent); border-color: var(--accent); color: #fff; }
  #state { min-width: 64px; text-align: right; font-size: 13px; }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; }
    header h1 { flex-basis: 100%; }
    #sample { flex: 1; }
    main { grid-template-columns: minmax(0, 1fr); }
    #code { min-height: 18em; }
    #output { min-height: 12em; }
  }
</style>
</head>
<body>
<header>
  <h1>Hanppie 课堂演示</h1>
  <select id="sample" aria-label="样例"></select>
  <span id="state"></span>
  <button id="run">运行</button>
  <button id="stop" disabled>停止</button>
</header>
<main>
  <section>
    <label for="code">程序</label>
    <textarea id="code" spellcheck="false" wrap="off"></textarea>
  </section>
  <section>
    <label for="input">输入</label>
    <textarea id="input" spellcheck="false"></textarea>
    <label for="output">输出</label>
    <pre id="output"></pre>
  </section>
</main>

& e) {\n        std::fprintf(stderr, \"error: %s\\n\", e.what());\n        return 1;\n    }\n    return 0;\n}\n"

:string soundtrack;  // friday_disco audio file, if given\n\nvoid print_msg(const std::string& message) {\n    std::printf(\"%s\\n\", message.c_str());\n    std::fflush(stdout);\n}\n\nvoid sleep(double seconds) { RobotCtrl::sleep(seconds); }\n\nvoid setAll(RobotCtrl& rm, int r, int g, int b, int effect) {\n    rm.led_ctrl.set_led(rm_define::armor_all, r, g, b, effect);\n}\n\n// Plays each note under a steady light, one beat apart.\nvoid chime(RobotCtrl& rm, const int* notes, int count, int r, int g, int b) {\n    for (int i = 0; i < count; ++i) {\n        setAll(rm, r, g, b, rm_define::effect_always_on);\n        rm.media_ctrl.play_sound(NOTES[notes[i]]);\n        sleep(BEAT);\n    }\n}\n\n\nclass Soundtrack {\npublic:\n    Soundtrack(RobotCtrl& rm, const hanppie::Bytes& encoded)\n        : rm_(rm), segments_(split(encoded)), stopping_(false), thread_(&Soundtrack::run, this) {}\n    ~Soundtrack() {\n        stopping_ = true;\n        thread_.join();\n    }\n\nprivate:\n    struct Segment {\n        hanppie::Bytes encoded;\n        double seconds;\n    };\n\n    static std::vector<Segment> split(const hanppie::Bytes& encoded) {\n        std::vector<Segment> segments;\n        Segment current = {hanppie::Bytes(), 0};\n        std::size_t offset = 0;\n        while (offset + 2 <= encoded.size()) {\n            std::size_t size = 2 + (encoded[offset] | (encoded[offset + 1] << 8));\n            if (offset + size > encoded.size()) throw std::runtime_error(\"truncated Opus packet\");\n            if (current.encoded.size() + size > 0xFFFF) {\n                segments.push_back(current);\n                current = Segment{hanppie::Bytes(), 0};\n            }\n            current.encoded.insert(current.encoded.end(), encoded.begin() + offset, encoded.begin() + offset + size);\n            current.seconds += 0.02;\n            offset += size;\n        }\n        if (!current.encoded.empty()) segments.push_back(current);\n        return segments;\n    }\n\n    void run() {\n th_time(90, 0.24);\n        gimbal.rotate_with_degree(gimbal_down, 7);\n    }\n    sleep(0.18);\n\n    print_msg(\"Beck: I wanna dance all night, all night!\");\n    for (int i = 0; i < 5; ++i) {\n        gimbal.rotate_with_degree(gimbal_up, 9);\n        chassis.move_with_time(0, 0.10);\n        gimbal.rotate_with_degree(gimbal_down, 9);\n        chassis.move_with_time(180, 0.10);\n    }\n    sleep(1.12);\n\n    print_msg(\"Beck: And I wanna drink all night...\");\n    setAll(rm, 255, 215, 0, effect_breath);\n    chassis.move_with_time(-90, 0.35);\n    gimbal.rotate_with_degree(gimbal_up, 8);\n    chassis.move_with_time(-90, 0.35);\n    gimbal.rotate_with_degree(gimbal_down, 8);\n    chassis.move_with_time(90, 0.25);\n    sleep(0.81);\n\n    print_msg(\"Beck: ...And I wanna party all night!\");\n    chassis.move_with_time(90, 0.35);\n    gimbal.rotate_with_degree(gimbal_up, 8);\n    chassis.move_with_time(90, 0.35);\n    gimbal.rotate_with_degree(gimbal_down, 8);\n    chassis.move_with_time(-90, 0.25);\n    sleep(0.97);\n\n    print_msg(\"Beck: ...And I wanna enjoy this night!\");\n    for (int i = 0; i < 3; ++i) {\n        chassis.move_with_time(-90, 0.20);\n        gimbal.rotate_with_degree(gimbal_up, 6);\n        chassis.move_with_time(90, 0.20);\n        gimbal.rotate_with_degree(gimbal_down, 6);\n    }\n    sleep(0.08);\n\n    // 39.08s - 64.12s: 周五高潮 + Everybody Hands Up!\n    print_msg(\"Beck: Because it is Friday... Friday night!\");\n    setAll(rm, 255, 0, 100, effect_flash);\n    chassis.move_with_time(0, 0.35);\n    gimbal.pitch_ctrl(15);\n    for (int i = 0; i < 3; ++i) {\n        chassis.move_with_time(-90, 0.26);\n        gimbal.rotate_with_degree(gimbal_down, 8);\n        chassis.move_with_time(90, 0.26);\n        gimbal.rotate_with_degree(gimbal_up, 8);\n    }\n    chassis.move_with_time(180, 0.35);\n    sleep(0.97);\n\n    print_msg(\"Beck: Everybody hands up!!\");\n    setAll(rm, 255, 215, 0, effect_always_on);\n    gimbal.pitch_ctrl(22);\n    for (int i = 0; i < 5; ++i) {\n        chassis.move_with_time(-90, 0.20);\n        chassis.move_with_time(90, 0.20);\n        gimbal.rotate_with_degree(gimbal_down, 6);\n        gimbal.rotate_with_degree(gimbal_up, 6);\n    }\n    sleep(0.67);\n\n    print_msg(\"Beck: It's all right, keep moving closer!\");\n    setAll(rm, 255, 0, 255, marquee);\n    chassis.move_with_time(0, 0.35);\n    gimbal.rotate_with_degree(gimbal_left, 18);\n    gimbal.rotate_with_degree(gimbal_right, 36);\n    gimbal.rotate_with_degree(gimbal_left, 18);\n    for (int i = 0; i < 3; ++i) {\n        chassis.move_with_time(-90, 0.24);\n        chassis.move_with_time(90, 0.24);\n    }\n    chassis.move_with_time(180, 0.35);\n    sleep(1.65);\n\n    print_msg(\"Beck: Party till the morning, buy you shots and drinks!\");\n    setAll(rm, 0, 255, 200, marquee);\n    for (int i = 0; i < 10; ++i) {\n        chassis.move_with_time(-90, 0.26);\n        gimbal.rotate_with_degree(gimbal_up, 7);\n        chassis.move_with_time(90, 0.26);\n        gimbal.rotate_with_degree(gimbal_down, 7);\n    }\n    sleep(1.52);\n\n    // 64.12s - 88.16s: 狂欢大回旋 + Nicole 尖叫 Dry Ice + 晋级谢幕\n    print_msg(\"Beck: Dancing all night long, kissing nonstop!\");\n    setAll(rm, 255, 100, 0, marquee);\n    for (int i = 0; i < 5; ++i) {\n        chassis.move_with_time(-90, 0.25);\n        gimbal.rotate_with_degree(gimbal_up, 8);\n        gimbal.rotate_with_degree(gimbal_down, 8);\n        chassis.move_with_time(90, 0.25);\n        gimbal.rotate_with_degree(gimbal_up, 8);\n        gimbal.rotate_with_degree(gimbal_down, 8);\n    }\n    sleep(1.01);\n\n    print_msg(\"Beck: Because it's Friday night!\");\n    setAll(rm, 255, 0, 255, effect_flash);\n    gimbal.pitch_ctrl(22);\n    chassis.move_with_time(0, 0.30);\n    for (int i = 0; i < 4; ++i) {\n        chassis.move_with_time(-90, 0.25);\n        gimbal.rotate_with_degree(gimbal_down, 7);\n        chassis.move_with_time(90, 0.25);\n        gimbal.rotate_with_degree(gimbal_up, 7);\n    }\n    chassis.move_with_time(180, 0.30);\n    sleep(1.17);\n\n    print_msg(\"Nicole 站上评委席热舞！Nicole 尖叫: Woo! Dry ice!! Simon 破天荒起立摇摆！\");\n    setAll(rm, 255, 255, 255, effect_flash);\n    for (int i = 0; i < 2; ++i) chassis.rotate_with_degree(clockwise, 360);\n    setAll(rm, 255, 0, 255, marquee);\n    gimbal.pitch_ctrl(22);\n    for (int i = 0; i < 4; ++i) {\n        chassis.move_with_time(-90, 0.22);\n        chassis.move_with_time(90, 0.22);\n        gimbal.rotate_with_degree(gimbal_down, 7);\n        gimbal.rotate_with_degree(gimbal_up, 7);\n    }\n    sleep(2.24);\n\n    print_msg(\"Beck: Friday night climax!\");\n    for (int i = 0; i < 4; ++i) {\n        chassis.move_with_time(0, 0.12);\n        gimbal.rotate_with_degree(gimbal_up, 8);\n        chassis.move_with_time(180, 0.12);\n        gimbal.rotate_with_degree(gimbal_down, 8);\n    }\n    sleep(0.75);\n\n    print_msg(\"全场起立欢呼！Beck Martin 晋级训练营 (Boot Camp)！鞠躬致谢！\");\n    setAll(rm, 255, 255, 255, effect_always_on);\n    gimbal.rotate_with_degree(gimbal_down, 20);\n    sleep(0.70);\n}\n}  // namespace\n\nint main() {\n    try {\n        RobotCtrl rm;\n        try {\n        fridayDisco(rm);\n        } catch (...) {\n            try { rm.led_ctrl.turn_off(rm_define::armor_all); rm.gimbal_ctrl.recenter(); } catch (...) {}\n            throw;\n        }\n        rm.led_ctrl.turn_off(rm_define::armor_all); rm.gimbal_ctrl.recenter();\n    } catch (const std::exception& e) {\n        std::fprintf(stderr, \"error: %s\\n\", e.what());\n        return 1;\n    }\n    return 0;\n}\n"

// END GENERATED SAMPLES

// The classroom runner on the computer that published this page; this
// computer when opened from a file.
const SERVICE = `http://${location.hostname || "127.0.0.1"}:8000`;

const $ = (id) => document.getElementById(id);
const sample = $("sample"), code = $("code"), input = $("input"), output = $("output");
const runButton = $("run"), stopButton = $("stop"), state = $("state");
let running = false;

SAMPLES.forEach((item, index) => sample.add(new Option(item.name, index)));
function loadSample() {
  const item = SAMPLES[sample.value];
  code.value = item.code;
  input.value = item.input;
}
sample.addEventListener("change", loadSample);
loadSample();

code.addEventListener("keydown", (event) => {
  if (event.key === "Tab") {
    event.preventDefault();
    code.setRangeText("    ", code.selectionStart, code.selectionEnd, "end");
  } else if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    run();
  }
});

function setRunning(value, label) {
  running = value;
  runButton.disabled = value;
  stopButton.disabled = !value;
  state.textContent = label;
}

function print(text, kind) {
  const span = document.createElement("span");
  if (kind) span.className = kind;
  span.textContent = text;
  output.append(span);
  output.scrollTop = output.scrollHeight;
}

async function errorText(response) {
  const text = await response.text();
  try {
    return JSON.parse(text).error;
  } catch {
    return text;
  }
}

const UNREACHABLE = `连不上课堂演示服务（${SERVICE}）\n`;
const MARKER = "\n[runner] ";
const RESULT = /\n\[runner\] (.*)\n$/;
const REASONS = [
  [/^finished \(exit code 0\)$/, "运行结束"],
  [/^finished \(exit code (-?\d+)\)$/, "运行结束，返回值 $1"],
  [/^stopped$/, "已停止"],
  [/^ended by signal (\w+)$/, "程序异常结束（$1）"],
  [/^timed out after (.*) s$/, "超过运行时间 $1 秒，已停止"],
  [/^output over .*$/, "输出太多，已停止"],
];

function describe(reason) {
  for (const [pattern, text] of REASONS) {
    if (pattern.test(reason)) return reason.replace(pattern, text);
  }
  return reason;
}

async function run() {
  if (running) return;
  output.textContent = "";
  setRunning(true, "编译中…");
  const form = new FormData();
  form.append("code", new Blob([code.value]), "main.cpp");
  if (input.value) form.append("input", new Blob([input.value]), "input.txt");
  let text = "";
  let response;
  try {
    response = await fetch(SERVICE + "/run", { method: "POST", body: form });
  } catch {
    print(UNREACHABLE, "error");
    setRunning(false, "");
    return;
  }
  try {
    if (response.status === 422) {
      print("编译失败\n\n", "error");
      print(await response.text());
      return;
    }
    if (!response.ok) {
      const message =
        response.status === 409 ? "已有程序在运行，请先停止" :
        response.status === 403 ? "服务不允许这个网页调用" :
        await errorText(response);
      print(message + "\n", "error");
      return;
    }
    state.textContent = "运行中";
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      text += value;
      // Hold back what may start the trailing result line until the stream ends.
      let ready = text.indexOf(MARKER);
      if (ready < 0) {
        ready = text.lastIndexOf("\n");
        if (ready < 0 || !MARKER.startsWith(text.slice(ready))) ready = text.length;
      }
      print(text.slice(0, ready));
      text = text.slice(ready);
    }
    const match = RESULT.exec(text);
    if (match) {
      print(text.slice(0, match.index));
      print("\n" + describe(match[1]) + "\n", "note");
    } else {
      print(text);
    }
  } catch (error) {
    print(text);
    print("\n连接中断：" + error.message + "\n", "error");
  } finally {
    setRunning(false, "");
  }
}

async function stop() {
  stopButton.disabled = true;
  state.textContent = "停止中…";
  try {
    await fetch(SERVICE + "/stop", { method: "POST" });
    if (!running) state.textContent = "";
  } catch (error) {
    print("\n停止失败：" + error.message + "\n", "error");
  }
}

runButton.addEventListener("click", run);
stopButton.addEventListener("click", stop);

fetch(SERVICE + "/status").then((response) => response.json()).then((status) => {
  if (status.state === "running" && !running) {
    state.textContent = "有程序在运行";
    stopButton.disabled = false;
  }
}).catch(() => {});
